<html>
    <head>
        <title>Incidencias</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="estilocss.css"/>
    </head>
    <body>
        <h2> Menu Principal</h2>
        <details>
            <summary>Menú de Usuario</summary>
            <div>
                <ul>
                    <li><a href="ServletMenuPrincipal">Menu principal</a></li>
                    <li><a href="ServletLecturaNombre?vista=tuperfil">Tu Perfil</a></li>
                </ul>
            </div>
        </details>
        <h1>Editar Incidencias</h1>
        <form action="ServletNuevaIncidencia" method ="post"> <!-- viene de servletlecturanombre editar -->
            <h2>Bienvenido {{nombreusu}}, ¿Cual es el Problema?</h2>   

            <label for="tipoincidencia">¿Qué tipo de incidencia a ocurrido?</label>
            <input type="text" name="incident" id="tipoincidencia" maxlength="25" required>

            <label for="comentario">Por favor escriba un resumen sobre cual ha sido la causa, daños, cuanto tiempo ha pasado, etc....</label>
            <textarea id="comentario" name="comentario" rows="5" cols="40" style ="width: 600px; height: 150px" required></textarea>

            <label for="fecha">Por favor introduce la fecha y hora de la incidencia:</label>
            <input type="datetime-local" name="fecha" id="fecha" required>

            <label for="producto">Seleccione el producto afectado:</label>
            <select id="producto" name="producto" required>
                <option value="" disabled selected>-- Seleccione una opción --</option>

                <!-- Primera sublista: Cupones -->
                <optgroup label="Cupones"> <!-- envia lista y ponla dentro de un mustache de cupon con id dentro de value y el nombre en option como su nombre -->
                    {{#cupon}}
                    <option value="Cupones_{{idcupon}}">{{nombreCupon}}</option>
                    {{/cupon}}
                </optgroup>

                <!-- Segunda sublista: Rascas -->
                <optgroup label="Rascas"> <!-- envia lista y ponla dentro de un mustache de rasca con id dentro de value y el nombre en option como su nombre -->
                    {{#rasca}}
                    <option value="Rascas_{{idrasca}}">{{nombreRasca}}</option><!-- {{.}} sirve si los datos no tienen nombre, solo son elementos -->
                    {{/rasca}}
                </optgroup>

            </select>
            <label for="codigo_postal">¿Cual es el codigo postal del lugar?</label>
            <input type="text" 
                   id="codigo_postal" 
                   name="codigo Postal" 
                   placeholder="39001"
                   pattern="[0-9]{5}" 
                   maxlength="5" 
                   title="El código postal debe contener exactamente 5 dígitos numéricos."
                   required>

            <label for="municipio">¿Cual es el municipio donde ha ocurrido el incidente?</label> 
            <!-- por comunidad y por pais mas tarde -->
            <select id="municipio" name="municipio">
                <option value="" disabled selected>-- Seleccione una opción --</option>
                <option value="Barcelona">Barcelona</option>
                <option value="Sevilla">Sevilla</option>
                <option value="Valencia">Valencia</option>
                <option value="Bilbao">Bilbao</option>
                <option value="Zaragoza">Zaragoza</option>
                <option value="Málaga">Málaga</option>
                <option value="Ourense">Ourense</option>
                <option value="Oviedo">Oviedo</option>
                <option value="Valladolid">Valladolid</option>
                <option value="Palma de Mallorca">Palma de Mallorca</option>
                <option value="Santa Cruz de Tenerife">Santa Cruz de Tenerife</option>               
            </select>

            <label for="lugar">¿En que lugar ha ocurrido?(El lugar de trabajo o, si ibas a trabajar, a que estacionamiento te dirigias)</label>
            <input type="text" name="lugar" id="lugar" maxlength="100" required>
            <button type="submit">😃</button>
        </form>
    </body>
</html>

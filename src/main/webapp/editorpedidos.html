<html>
    <head>
        <title>Editor Pedidos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="estilocss.css"/>
    </head>
    <body>
        <h1>De acuerdo {{dueñosesion}}, ¿Que quieres hacer?</h1>
        {{#formulario}}
        {{#administrador}}

        <form action="ServletEdicion" method="post">
            <h2>{{TrabajadorNombre}} {{TrabajadorApellidos}}</h2>
            <label for="producto">Introduce el producto:</label>
            <input type="text" id="producto" name="producto" value="{{producto}}" maxlength="40" required>

            <label for="fechapedido">Fecha de pedido</label>
            <input type="datetime-local" id="fechapedido" name="fechapedido" value="{{fechacupon}}" required>

            <label for="serie">Introduce el numero de serie:</label>
            <input type="text" id="serie" name="serie" value="{{serie}}" maxlength="11" required>

            <label for="cantidad">Cantidades:</label>
            <input type="number" name="cantidad" min="1" max="10" value="{{pedido}}" required> 

            <label for="precio">Precio (€):</label>
            <input type="number" id="precio" name="precio" min="0" placeholder="0.50" value="{{precio}}" readonly>

            <input type="hidden" value="{{idpedido}}" name="idpedido">
            <input type="hidden" value="pedido" name="editar">
            <button type="submit">😃</button>
        </form>  
        {{/administrador}}
        {{#trabajadorlimite}}
        <form action="ServletEdicion" method="post">

            <label for="producto">Introduce el producto:</label>
            <input type="text" id="producto" name="producto" value="{{producto}}" maxlength="40" required>

            <label for="fechapedido">Fecha de pedido</label>
            <input type="datetime-local" id="fechapedido" name="fechapedido" value="{{fechacupon}}" readonly>

            <label for="serie">Introduce el numero de serie:</label>
            <input type="text" id="serie" name="serie" value="{{serie}}" maxlength="11" readonly>

            <label for="cantidad">Cantidades:</label>
            <input type="number" name="cantidad" min="1" max="10" value="{{pedido}}" required> 

            <label for="precio">Precio (€):</label>
            <input type="number" id="precio" name="precio" min="0" placeholder="0.50" value="{{precio}}" readonly>

            <input type="hidden" value="{{idpedido}}" name="idpedido"> <!-- enviamos para guardar el trabajador que es -->
            <input type="hidden" value="pedido" name="editar"> <!-- enviamos para la opcion del menu -->
            <button type="submit">😃</button>

        </form>
        {{/trabajadorlimite}}
        {{/formulario}}
    </body>

</html>

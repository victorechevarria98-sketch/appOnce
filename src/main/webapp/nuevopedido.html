<!-- puedes hacer el pedido de todo a la vez si quieres -->
<html>
    <head>
        <title>Pedidos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="estilocss.css"/>
    </head>
    <body>
        <h2> Menu Principal</h2>
        <details>
            <summary>Menú de Usuario</summary>
            <div>
                <ul>
                    <li><a href="ServletMenuPrincipal">Menu principal</a></li>
                    <li><a href="ServletLecturaNombre?vista=tuperfil">Tu Perfil</a></li>
                </ul>
            </div>
        </details>
        <h1>Nuevo pedido</h1>
        <h2>Bienvenido {{nombreusu}}, Introduzca los datos de su nuevo pedido </h2> <!-- viene de servletlecturanombre editar -->
        <form action="ServletPedidos" method="post">
            <h3>Cupones</h3> <!-- repite lo mismo que con nueva incidencia, deberia solo necesitar 1 li cambiando todo lo que ponga su nombre y en cantidades el id del producto -->
            <ul>
                {{#cupon}}

                <li>
                    <label for="{{nombreCupon}}">{{nombreCupon}}</label>
                    <input type="checkbox" id="{{nombreCupon}}" name="ProductoCupon" value="{{idcupon}}"> <!-- esto es el id de cada producto que enviaremos al servlet -->
                    <input type="number" name="cantidades_{{idcupon}}" min="1" max="10" value="1">  <!-- marcamos cada cantidad con su id correspondiente -->
                </li>

                {{/cupon}}
            </ul>
            <h3>Rascas</h3>
            <ul>
                {{#rasca}}

                <li>
                    <label for="{{nombreRasca}}">{{nombreRasca}}</label>
                    <input type="checkbox" id="{{nombreRasca}}" name="productosrasca" value="{{idrasca}}">
                    <input type="number" name="cantidades_{{idrasca}}" min="1" max="10" value="1">
                </li>

                {{/rasca}}
            </ul>
            <button type="submit">😃</button>
            <button type="reset">😣</button>
        </form>
    </body>
</html>
